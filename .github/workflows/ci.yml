name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: matrix
          POSTGRES_DB: matrix
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U matrix -d matrix"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MATRIX_TEST_DATABASE_URL: postgres://matrix@127.0.0.1:5432/matrix
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          bash ops/bosgame/install-gitleaks.sh "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Secret scan (fail closed)
        run: gitleaks dir . --redact --no-banner
      - run: bun install --frozen-lockfile
      - run: bun run check
